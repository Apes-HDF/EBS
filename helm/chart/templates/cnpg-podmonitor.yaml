{{- if and .Values.cnpg.enabled .Values.cnpg.monitoring.podMonitor.enabled }}
# Same spec as the PodMonitor CNPG generates with spec.monitoring.enablePodMonitor, which is
# deprecated: exposes the instances' metrics (port 9187), including the barman-cloud plugin's
# backup metrics (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp...).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "plateforme-ebs.cnpgClusterName" . }}
  labels:
    {{- include "plateforme-ebs.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "plateforme-ebs.cnpgClusterName" . }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
{{- end }}
