{{- if .Values.meilisearch.enabled }}
{{- $secretName := printf "%s-%s" (include "meilisearch.fullname" .Subcharts.meilisearch) "master-key" }}
# Master key générée une fois via ESO plutôt que via le `lookup` du sous-chart meilisearch (ne
# fonctionne pas avec ArgoCD, qui rend en `helm template` pur : chaque sync régénère une nouvelle
# clé aléatoire dans le Secret sans jamais redémarrer le StatefulSet Meilisearch, qui garde
# l'ancienne -- 403 "provided API key is invalid" dès qu'un pod relit le Secret). Même pattern que
# cnpg-app-secret.yaml. Le sous-chart est configuré via meilisearch.auth.existingMasterKeySecret
# (values.yaml) pour consommer CE secret au lieu de générer le sien.
# refreshPolicy: CreatedOnce + target.immutable évitent qu'ESO régénère le mot de passe à chaque
# reconcile (le générateur Password n'a pas d'état persisté).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "plateforme-ebs.labels" . | nindent 4 }}
spec:
  length: 20
  symbols: 0
  symbolCharacters: ""
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "plateforme-ebs.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    immutable: true
    template:
      data:
        MEILI_MASTER_KEY: {{ `{{ .password }}` | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $secretName }}
{{- end }}
