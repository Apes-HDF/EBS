{{- if include "plateforme-ebs.reindexJobEnabled" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-reindex
  labels:
    {{- include "plateforme-ebs.labels" . | nindent 4 }}
spec:
  # The reindex Job has its own selector labels (plateforme-ebs.selectorLabelsReindex) so it isn't
  # picked up as a Service endpoint. It only reads the database and writes to Meilisearch: unlike
  # allow-app-fixtures, no egress outside the cluster.
  podSelector:
    matchLabels:
      {{- include "plateforme-ebs.selectorLabelsReindex" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # This release's CNPG database (products to index)
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "plateforme-ebs.cnpgClusterName" . }}
      ports:
        - protocol: TCP
          port: 5432
    {{- if .Values.redis.enabled }}
    # This release's Redis (app cache, used by the Doctrine result cache)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    # This release's Meilisearch (app:index-products)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: meilisearch
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 7700
{{- end }}
