{{- if .Values.redis.enabled }}
{{- $secretName := printf "%s-redis-auth" .Release.Name }}
# Mot de passe Redis généré une fois via ESO (même pattern que meilisearch-master-key-secret.yaml et
# cnpg-app-secret.yaml) : consommé par le sous-chart redis (redis.auth.existingSecret, clé
# redis-password) et par l'application (REDIS_URL, clé redis-url, qui embarque le mot de passe).
# refreshPolicy: CreatedOnce + target.immutable évitent qu'ESO régénère le mot de passe à chaque
# reconcile (le générateur Password n'a pas d'état persisté). Sans symboles : le mot de passe est
# inséré tel quel dans l'URL.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "plateforme-ebs.labels" . | nindent 4 }}
spec:
  length: 32
  symbols: 0
  symbolCharacters: ""
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "plateforme-ebs.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    immutable: true
    template:
      data:
        redis-password: {{ `{{ .password }}` | quote }}
        redis-url: {{ printf "redis://:{{ .password }}@%s:6379" (include "redis.fullname" .Subcharts.redis) | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $secretName }}
{{- end }}
