{{- if .Values.cnpg.enabled }}
{{- $secretName := printf "%s-credentials" (include "plateforme-ebs.cnpgClusterName" .) }}
# Mot de passe généré une fois via ESO plutôt qu'un `lookup` (ne fonctionne pas avec ArgoCD, qui
# rend en `helm template` pur -- même pattern que
# union-sociale-des-scop-helm-chart/templates/cnpg-metabase-secret.yaml.
# refreshPolicy: CreatedOnce + target.immutable évitent qu'ESO régénère le mot de passe à chaque
# reconcile (le générateur Password n'a pas d'état persisté).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "plateforme-ebs.labels" . | nindent 4 }}
spec:
  length: 32
  symbols: 0
  symbolCharacters: ""
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "plateforme-ebs.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    immutable: true
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.cnpg.owner | quote }}
        password: {{ `{{ .password }}` | quote }}
        database-url: {{ printf "postgresql://%s:{{ .password }}@%s-rw/%s?serverVersion=%s&charset=utf8" .Values.cnpg.owner (include "plateforme-ebs.cnpgClusterName" .) .Values.cnpg.database .Values.cnpg.postgresql.version | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $secretName }}
{{- end }}
