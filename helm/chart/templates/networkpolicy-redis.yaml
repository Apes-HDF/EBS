{{- if .Values.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "plateforme-ebs" . }}-redis
  labels:
    {{- include "plateforme-ebs.labels" . | nindent 4 }}
spec:
  # Selector matches the Bitnami/cloudpirates redis subchart's own pod labels, not
  # plateforme-ebs.selectorLabels.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "plateforme-ebs.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
