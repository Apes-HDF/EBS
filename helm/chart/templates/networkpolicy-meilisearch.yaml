{{- if .Values.meilisearch.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "plateforme-ebs" . }}-meilisearch
  labels:
    {{- include "plateforme-ebs.labels" . | nindent 4 }}
spec:
  # Selector matches the meilisearch subchart's own pod labels, not
  # plateforme-ebs.selectorLabels.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "plateforme-ebs.selectorLabels" . | nindent 14 }}
        {{- if .Values.php.fixtureJob.enabled }}
        - podSelector:
            matchLabels:
              {{- include "plateforme-ebs.selectorLabelsFixtures" . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 7700
{{- end }}
