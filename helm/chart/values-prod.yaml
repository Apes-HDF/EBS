imagePullSecrets:
  - name: regcred

route:
  enabled: true
  host: ebs.apes-hdf.org
  extraHosts:
   - plateforme-ebs.lt-mut-prod-scw.les-tilleuls.solutions

# Matches create_cnpg_backup = true on the "plateforme-ebs" namespace in opentofu-scaleway-infra-mut.
cnpg:
  monitoring:
    podMonitor:
      enabled: true
  backup:
    enabled: true
    workspace: prod

meilisearch:
  persistence:
    enabled: true
    storageClass: "sbs-default"
    size: "1Gi"

redis:
  persistence:
    enabled: true
    storageClass: "sbs-default"
    size: "1Gi"

php:
  fixtureJob:
    enabled: false
  fixtureCron:
    enabled: false
