imagePullSecrets:
  - name: regcred

route:
  enabled: true
  host: plateforme-ebs.lt-mut-nonprod-scw.les-tilleuls.solutions

# Matches create_cnpg_backup = true on the "plateforme-ebs" namespace in opentofu-scaleway-infra-mut.
cnpg:
  monitoring:
    podMonitor:
      enabled: true
  backup:
    enabled: true
    workspace: nonprod

meilisearch:
  persistence:
    enabled: true
    storageClass: "sbs-default"
    size: "1Gi"

redis:
  persistence:
    enabled: true
    storageClass: "sbs-default"
    size: "1Gi"

php:
  fixtureJob:
    enabled: true
  fixtureCron:
    enabled: true
