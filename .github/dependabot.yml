# Dependabot configuration, Symfony project.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Two settings are not decorative:
#  - `applies-to: version-updates` on every group. Without it, security updates
#    would be grouped and delayed instead of landing as individual, immediate
#    pull requests — the opposite of the intended behavior.
#  - `cooldown` only applies to version updates, it never delays security ones.
#
# Each ecosystem starts with an `<ecosystem>-patch` group (patch updates only),
# merged automatically once the CI is green (dependabot-auto-merge.yml).
# Dependabot puts a dependency in the most specific matching group, not the first
# one: the other groups therefore explicitly exclude patch updates, otherwise they
# would capture them and the mixed minor+patch pull request would not be merged.
# They keep collecting the minor (and, where they did, major) updates for review.
# `allow: dependency-type: all` on composer and npm also updates indirect
# dependencies in the lockfile (e.g. Symfony components pulled in by a bundle).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    allow:
      - dependency-type: all
    groups:
      composer-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      symfony:
        applies-to: version-updates
        patterns: ["symfony/*", "doctrine/*"]
        update-types: ["minor"]
      dev:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "major"]
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor"]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown: { default-days: 7, semver-major-days: 30 }
    allow:
      - dependency-type: all
    groups:
      npm-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      npm-dev:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "major"]
      npm-prod:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor"]

  - package-ecosystem: helm
    directory: /helm/chart
    schedule: { interval: weekly, day: monday }
    commit-message:
      prefix: "chore(deps)"
    cooldown: { default-days: 7, semver-major-days: 30 }
    groups:
      helm-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      helm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      actions:
        patterns: ["*"]
        update-types: ["minor", "major"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message:
      prefix: "chore(deps)"
    cooldown: { default-days: 7, semver-major-days: 30 }
    groups:
      docker-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
