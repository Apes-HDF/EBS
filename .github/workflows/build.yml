name: Build

on:
  workflow_call:

jobs:
  build-push-php:
    environment: PROD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Build/Push
      uses: coopTilleuls/action-docker-build-push@v13
      with:
        IMAGE_NAME: ${{ vars.IMAGE_NAME_PHP }}
        BUILD_CONTEXT: .
        BUILD_TARGET: app_php
        REGISTRY_JSON_KEY: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_REPOSITORY: ${{ vars.IMAGE_REPO }}
         
  build-push-caddy:
    environment: PROD
    # Same Dockerfile as php, with a build target which is after
    needs: [build-push-php]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Build/Push
      uses: coopTilleuls/action-docker-build-push@v13
      with:
        IMAGE_NAME: ${{ vars.IMAGE_NAME_CADDY }}
        BUILD_CONTEXT: .
        BUILD_TARGET: app_caddy
        REGISTRY_JSON_KEY: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_REPOSITORY: ${{ vars.IMAGE_REPO }}

  # Push miroir vers le registry du cloudprovider, en plus du push ghcr.io ci-dessus, le temps des tests de
  # bascule vers le nouveau cluster (cf ApplicationSet ArgoCD, /
  build-push-custom-registry:
    environment: PROD
    strategy:
      matrix:
        include:
        - target: app_php
          image_var: NEW_IMAGE_NAME_PHP
        - target: app_caddy
          image_var: NEW_IMAGE_NAME_CADDY
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Build/Push
      uses: coopTilleuls/action-docker-build-push@v13
      with:
        IMAGE_NAME: ${{ vars[matrix.image_var] }}
        BUILD_CONTEXT: .
        BUILD_TARGET: ${{ matrix.target }}
        REGISTRY_JSON_KEY: ${{ secrets.REGISTRY_PASSWORD }}
        IMAGE_REPOSITORY: ${{ vars.REGISTRY_NAME }}
        TAGS: |
          type=raw,value=prod-{{sha}},enable=${{ github.ref_type == 'tag' }}
          type=raw,value=nonprod-{{sha}},enable=${{ github.event_name != 'pull_request' && github.ref_type != 'tag' }}
          type=sha,enable=${{ github.event_name == 'pull_request' }}
